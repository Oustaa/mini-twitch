services:
  auth-db:
    image: mysql:8.4
    container_name: auth_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-short_url}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "3333:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  auth:
    build: .
    env_file: .env
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "4002:3000"
    networks:
      - backend

networks:
  backend:

volumes:
  auth-db-data:
